name: local_ai_remote
description: Fernzugriff auf lokale LLMs über Tailscale, mit Statusanzeige und Systemtelemetrie.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.3.2
  file_picker: ^12.2.0

  # Persistenz: sqflite braucht auf Windows das FFI-Backend, weil dort kein
  # System-SQLite mitgeliefert wird.
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4

  # Auf LLM-Ausgabe zugeschnitten: verkraftet unvollstaendige Syntax, wie sie
  # waehrend des Streams zwangslaeufig entsteht.
  gpt_markdown: ^1.2.1

  syncfusion_flutter_pdf: ^26.2.14
  uuid: ^4.5.0
  # Nur fuer feste Links in "Über" (Repo, Releases) - nie fuer Adressen aus
  # Modellausgaben.
  url_launcher: ^6.3.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Erzeugt die Icon-Groessen fuer Android und Windows aus assets/icon/.
  # Noetig, weil die Plattformordner nicht im Repo liegen: dort abgelegte
  # Icons waeren beim naechsten `flutter create` weg.
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Quelle: assets/icon/, erzeugt von tool/icon_erzeugen.py.
# Neu erzeugen mit: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"

  android: true
  # Adaptives Icon: Android beschneidet den Vordergrund je nach Geraet zu
  # Kreis, Quadrat oder Kleeblatt - deshalb traegt er den Hintergrund nicht
  # selbst, sondern bekommt ihn als Flaeche daneben.
  adaptive_icon_background: "#0F1418"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  # Monochrom fuer Material You: Android faerbt es selbst ein.
  adaptive_icon_monochrome: "assets/icon/icon_foreground.png"

  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
