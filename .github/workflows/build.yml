name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Version als Release veroeffentlichen, z. B. v0.1.0 (leer = nur bauen)'
        required: false
        default: ''

# Standard ist nur Lesen; der Release-Job holt sich Schreibrecht selbst.
permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r gateway/requirements-dev.txt
      - run: python -m pytest gateway/tests -q

  app-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # Die Tests brauchen keine Plattformordner - nur die Pakete.
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  android:
    needs: [gateway, app-test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # Die Plattformordner liegen nicht im Repo, damit der Baum schlank
      # bleibt - sie werden hier erzeugt.
      # `flutter create` legt ein widget_test.dart fuer eine Beispiel-App an,
      # das gegen diesen Baum nicht kompiliert.
      - run: flutter create --platforms=android --org de.nicolas .
      - run: rm -f test/widget_test.dart README.md
      - run: flutter pub get
      # Die Icons liegen in den generierten Plattformordnern - ohne diesen
      # Schritt traegt die APK das Flutter-Standardicon.
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

  windows:
    needs: [gateway, app-test]
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=windows --org de.nicolas .
      # Auf windows-latest ist die Standardshell PowerShell, dort gibt es
      # kein `rm -f`.
      - run: rm -f test/widget_test.dart README.md
        shell: bash
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: app/build/windows/x64/runner/Release/

  # Bei einem Tag v* oder einem manuellen Start mit Version: APK und
  # Windows-Build als Release anhaengen. Die Artefakte oben laufen nach 90
  # Tagen ab und brauchen ein GitHub-Konto, ein Release nicht. Beim manuellen
  # Start legt `gh release create` den Tag auf dem gebauten Commit an.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release }}
    steps:
      - name: Version pruefen
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error::Ungueltige Version: $VERSION"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Dateien benennen
        run: |
          mv dist/apk/app-release.apk "dist/lokal-ai-${VERSION}.apk"
          (cd dist/windows && zip -qr "../lokal-ai-${VERSION}-windows.zip" .)
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes \
            "dist/lokal-ai-${VERSION}.apk" \
            "dist/lokal-ai-${VERSION}-windows.zip"
